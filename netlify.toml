# Netlify build configuration.
#
# Secrets scanning: this app is a client-side Vite SPA that initializes the
# Firebase Web SDK from firebase-applet-config.json. Those values are public
# client identifiers by design — the Firebase Web API key, app ID and OAuth
# client ID are meant to be shipped in browser code, and access control is
# enforced by firestore.rules (default-deny with per-collection validation),
# not by keeping the key private.
#
# Netlify's smart detection recognizes their formats and flags them as likely
# secrets. They are safelisted below so real secrets are still caught: only
# these exact known-public strings are ignored, and scanning otherwise stays
# fully enabled for the repo and the build output.
#
# If firebase-applet-config.json is ever regenerated with new values, update
# this list to match.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBmj2imzV2veXEEWLG5aFmhqj8QH1Q70x0,1:641270478115:web:b375f8fe967e8445810896,641270478115-80p6io7oj223juj8f8j99tlkbun4eahn.apps.googleusercontent.com"
